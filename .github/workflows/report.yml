name: Momentum report

on:
  schedule:
    # 1st and 15th at 13:00 UTC (8:00 AM CDT / 7:00 AM CST), before the market opens,
    # so the latest daily bar is always the previous completed close.
    - cron: "0 13 1,15 * *"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report
        run: python momentum.py --out index.html --json data.json

      - name: Commit report
        run: |
          git config user.name "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add index.html data.json
          git diff --cached --quiet || git commit -m "Report $(date -u +%F)"
          git push
