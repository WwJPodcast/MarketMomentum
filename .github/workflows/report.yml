name: Momentum report

on:
  schedule:
    # Fridays at 06:17 UTC = 1:17 AM CDT / 12:17 AM CST, i.e. just after midnight
    # on payday. Markets are closed, so the newest daily bar is Thursday's close.
    # The odd minute avoids GitHub's busy top-of-the-hour delays.
    # Runs weekly; the gate step below keeps only every other Friday (payday weeks).
    - cron: "17 6 * * 5"
  workflow_dispatch:   # lets you run it by hand from the Actions tab (always runs)

permissions:
  contents: write

concurrency:
  group: momentum-report
  cancel-in-progress: false   # never run two reports at once

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      # Optional phone notifications via ntfy.sh. Add a repo secret named NTFY_TOPIC
      # (Settings > Secrets and variables > Actions). Without it, notify steps are skipped.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Payday-week gate
        id: gate
        run: |
          # Anchor: Friday 2026-06-05, 20 pay periods before payday Fri 2026-10-23.
          # Scheduled runs go ahead only on an even number of weeks after it.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            days=$(( ( $(date -u +%s) - $(date -u -d 2026-06-05 +%s) ) / 86400 ))
            if [ $(( (days / 7) % 2 )) -ne 0 ]; then
              echo "Off week, skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build report
        if: steps.gate.outputs.run == 'true'
        run: python momentum.py --out index.html --json data.json

      - name: Commit report
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          # Re-base the generated files onto the latest main so a push made while
          # this job was running can never cause a rejected push.
          mkdir -p "$RUNNER_TEMP/out"
          cp index.html data.json "$RUNNER_TEMP/out/"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/out/index.html" "$RUNNER_TEMP/out/data.json" .
          git add index.html data.json
          git diff --cached --quiet || git commit -m "Report $(date -u +%F)"
          git push origin HEAD:main

      - name: Notify - report ready
        if: steps.gate.outputs.run == 'true' && env.NTFY_TOPIC != ''
        run: |
          sleep 90   # give GitHub Pages a moment to publish the new page
          buys=$(python -c "import json; print(', '.join(json.load(open('data.json'))['buys']) or 'none')")
          asof=$(python -c "import json; print(json.load(open('data.json'))['asof'])")
          curl -fsS -H "Title: Momentum report ready" \
            -H "Click: https://wwjpodcast.github.io/MarketMomentum/" \
            -d "Buy candidates: $buys (close $asof)" "https://ntfy.sh/$NTFY_TOPIC"

      - name: Notify - report failed
        if: failure() && env.NTFY_TOPIC != ''
        run: |
          curl -fsS -H "Title: Momentum report FAILED" -H "Priority: high" \
            -H "Click: https://github.com/WwJPodcast/MarketMomentum/actions" \
            -d "The report did not build. Open Actions for the log." "https://ntfy.sh/$NTFY_TOPIC"
