name: Momentum report

on:
  schedule:
    # Weekdays at 06:17 UTC = 1:17 AM CDT / 12:17 AM CST. Markets are closed, so the
    # newest daily bar is the previous close. The odd minute avoids GitHub's busy
    # top-of-the-hour delays. Payday-week logic (the NEW chip baseline) lives in momentum.py.
    - cron: "17 6 * * 1-5"
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: momentum-report
  cancel-in-progress: false   # never run two reports at once

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build report
        run: python momentum.py --out index.html --json data.json --paydays paydays.json

      - name: Commit report
        run: |
          git config user.name "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          # Re-base the generated files onto the latest main so a push made while
          # this job was running can never cause a rejected push.
          mkdir -p "$RUNNER_TEMP/out"
          cp index.html data.json paydays.json "$RUNNER_TEMP/out/"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/out/index.html" "$RUNNER_TEMP/out/data.json" "$RUNNER_TEMP/out/paydays.json" .
          git add index.html data.json paydays.json
          git diff --cached --quiet || git commit -m "Report $(date -u +%F)"
          git push origin HEAD:main
